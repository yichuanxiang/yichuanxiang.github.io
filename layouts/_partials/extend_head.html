{{- $genjutsu := resources.Get "js/journal-genjutsu-composite.js" | minify | fingerprint -}}
<script src="{{ $genjutsu.RelPermalink }}" integrity="{{ $genjutsu.Data.Integrity }}"></script>
<script>
// Only this site's own desk windows use the compact reading layout.
if (window.self !== window.top && window.frameElement?.hasAttribute('data-journal-frame')) {
  document.documentElement.classList.add('journal-embedded');
  const style = document.createElement('style');
  style.textContent = '@view-transition { navigation: none; }';
  document.head.append(style);
  document.addEventListener('click', function (event) {
    const link = event.target.closest('a[href]');
    if (!link || event.defaultPrevented || event.button || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || link.target || link.hasAttribute('download')) return;
    const url = new URL(link.href);
    if (url.origin !== location.origin) { link.target = '_blank'; link.rel = 'noopener'; return; }
    if (url.pathname === location.pathname && url.hash) return;
    if (url.pathname === '/') { event.preventDefault(); parent.postMessage({ type: 'journal-close' }, location.origin); return; }
    url.searchParams.set('panel', '1');
    link.href = url.href;
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && !document.querySelector('.cappu-lightbox.is-open')) {
      event.preventDefault(); parent.postMessage({ type: 'journal-close' }, location.origin);
    }
  });
}
// Keep the destination covered from its first paint. The footer consumes the
// marker and opens the page from this same centre once its DOM is ready.
try {
  const arrival = JSON.parse(sessionStorage.getItem('journal-petal-arrival'));
  const navigation = performance.getEntriesByType('navigation')[0]?.type;
  if (!window.journalTransitionPreview && !document.documentElement.classList.contains('journal-embedded') &&
      arrival?.effect === 'kamui' && arrival.destination === location.pathname + location.search &&
      Date.now() - arrival.at >= 0 && Date.now() - arrival.at <= 15000 &&
      navigation !== 'reload' && navigation !== 'back_forward' &&
      !matchMedia('(prefers-reduced-motion: reduce)').matches && !document.hidden) {
    document.documentElement.dataset.journalKamui = 'pending';
    setTimeout(function () {
      if (document.documentElement.dataset.journalKamui === 'pending') delete document.documentElement.dataset.journalKamui;
    }, 5000);
  }
  if (!window.journalTransitionPreview && !document.documentElement.classList.contains('journal-embedded') &&
      window.JournalGenjutsu && arrival?.effect === 'genjutsu' && arrival.destination === location.pathname + location.search &&
      Date.now() - arrival.at >= 0 && Date.now() - arrival.at <= 15000 &&
      navigation !== 'reload' && navigation !== 'back_forward' &&
      !matchMedia('(prefers-reduced-motion: reduce)').matches && !document.hidden) {
    if (arrival.compatCompleted) {
      window.journalGenjutsuHandled = true;
      document.documentElement.classList.add('journal-genjutsu-arrived', 'journal-genjutsu-ready');
      setTimeout(function () { document.documentElement.classList.remove('journal-genjutsu-arrived'); }, 600);
    }
    else {
      document.documentElement.dataset.journalGenjutsuTone = arrival.tone === 'cel' ? 'cel' : 'ink';
      document.documentElement.dataset.journalGenjutsu = 'pending';
    }
  }
} catch { /* Storage is optional. */ }
window.addEventListener('pageswap', function (event) {
  if ((document.documentElement.dataset.journalKamui === 'out' || window.JournalGenjutsu?.active) && event.viewTransition) {
    event.viewTransition.ready.catch(function () {});
    event.viewTransition.finished.catch(function () {});
    event.viewTransition.skipTransition();
  }
});
// Keep the first-visit entrance separate from native page-to-page transitions.
window.addEventListener('pagereveal', function (event) {
  if (event.viewTransition) {
    event.viewTransition.ready.catch(function () {});
    event.viewTransition.finished.catch(function () {});
    event.viewTransition.updateCallbackDone?.catch(function () {});
    if (window.journalTransitionPreview || window.journalGenjutsuHandled) { event.viewTransition.skipTransition(); return; }
    if (window.JournalGenjutsu?.reveal(event)) return;
    if (document.documentElement.dataset.journalKamui) {
      event.viewTransition.ready.catch(function () {});
      event.viewTransition.skipTransition();
      return;
    }
    document.documentElement.classList.add('station-page-transition');
    window.journalPageTransition = event.viewTransition.finished;
  }
});
</script>
