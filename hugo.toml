baseURL = "https://yichuanxiang.github.io/"
languageCode = "zh-CN"
defaultContentLanguage = "zh"
title = "仪传祥的个人博客"
theme = "PaperMod"
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "记录生活、灵感、技术与喜欢的事。"
  defaultTheme = "auto"
  mainSections = ["posts"]
  DateFormat = "2006年1月2日"
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowPostNavLinks = true

[params.label]
  icon = "/images/avatar-yichuanxiang.jpg"
  iconHeight = 44

[params.assets]
  favicon = "/favicon.svg"
  favicon16x16 = "/favicon.svg"
  favicon32x32 = "/favicon.svg"
  apple_touch_icon = "/favicon.svg"
  safari_pinned_tab = "/favicon.svg"

[params.homeInfoParams]
  Title = "仪传祥的个人博客"
  Content = "写下生活里的小事，也记录偶尔认真的思考。技术只是其中一章，这里更像一本慢慢长大的私人手记。"

